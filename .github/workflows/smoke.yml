name: smoke
permissions:
  contents: read

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  verifier-regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q

  verify-known-good-release:
    name: Verify a known-good published release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the action against falsification-ledger 0.1.3 (published)
        uses: ./
        with:
          package: falsification-ledger
          version: 0.1.3
          expected-files: |
            falsification_ledger/schema/*.json
          smoke-commands: |
            fl version
            fl --help
            python -c "import falsification_ledger as p; import importlib.metadata as m; assert p.__version__ == m.version('falsification-ledger')"

  fail-closed-on-bad-version:
    name: Expect failure for a nonexistent version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action with a version that does not exist
        id: bad
        continue-on-error: true
        uses: ./
        with:
          package: falsification-ledger
          version: 999.0.0
          timeout-seconds: "30"
          poll-seconds: "5"
      - name: Assert the action failed closed
        run: |
          if [ "${{ steps.bad.outcome }}" == "success" ]; then
            echo "expected the action to fail for version 999.0.0"
            exit 1
          fi
          echo "fail-closed OK"
