name: pypi-verify-action
description: Verify the exact public PyPI package in a fresh venv, fail-closed.
author: holdout-labs
branding:
  icon: package
  color: blue
inputs:
  package:
    description: PyPI project name to verify
    required: true
  version:
    description: Exact version already uploaded to PyPI
    required: true
  python-version:
    description: Python version for the verification venv
    default: "3.11"
  timeout-seconds:
    description: Maximum wait for public PyPI index propagation
    default: "300"
  poll-seconds:
    description: Poll interval while waiting for propagation
    default: "10"
  expected-files:
    description: Optional newline-separated site-packages globs that must exist
    default: ""
  smoke-commands:
    description: Optional trusted shell commands, one per line, run from a disposable directory
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Verify the public PyPI installation
      shell: bash
      env:
        ACTION_SOURCE: ${{ github.action_path }}
        VERIFY_PACKAGE: ${{ inputs.package }}
        VERIFY_VERSION: ${{ inputs.version }}
        VERIFY_TIMEOUT: ${{ inputs.timeout-seconds }}
        VERIFY_POLL: ${{ inputs.poll-seconds }}
        VERIFY_FILES: ${{ inputs.expected-files }}
        VERIFY_COMMANDS: ${{ inputs.smoke-commands }}
      run: |
        export VERIFY_BASH="$BASH"
        if command -v cygpath >/dev/null 2>&1; then
          export VERIFY_BASH="$(cygpath -w "$BASH")"
        fi
        python "$ACTION_SOURCE/verify.py"
